# Aplicacao
spring.application.name=api-brindes

# Le o arquivo local que fica ao lado do pom.xml
spring.config.import=optional:file:./config-local.properties

# MySQL
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/estoque_brindes}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Autenticacao
api.security.token.secret=${JWT_SECRET}

# Servidor
server.port=${PORT:8080}

# Validacao dos dados recebidos
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false