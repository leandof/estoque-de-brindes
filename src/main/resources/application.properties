# =========================================================
# APLICAÇÃO
# =========================================================

spring.application.name=api-brindes


# =========================================================
# BANCO DE DADOS MYSQL
# =========================================================

spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/estoque_brindes}

spring.datasource.username=${MYSQL_USER:root}

spring.datasource.password=${MYSQL_PASSWORD:leo3434}


# Driver MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false


# =========================================================
# JWT
# =========================================================

api.security.token.secret=${JWT_SECRET:estoque-brindes-local-dev-2026-chave-secreta}


# =========================================================
# SERVIDOR
# =========================================================

server.port=${PORT:8080}